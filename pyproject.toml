[project]
name = "luna"
version = "0.1.0"
authors = [{ name = "karin0", email = "karin0@gmx.com" }]
requires-python = ">=3.14"

[project.optional-dependencies]
rich = ["rich>=14.0.0"]
netifaces = ["netifaces-plus>=0.12.5"]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.15.12",
]

[tool.uv]
exclude-newer = "15 days"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL", "ANN401"]
ignore = [
    "A",
    "ANN",
    "ARG",
    "CPY",
    "D",
    "EM",
    "ERA",
    "FAST",
    "FBT",
    "FIX",
    "PLR",
    "PTH",
    "TD",
    "COM812",

    "BLE001",
    "N818",
    "PLW0603",
    "PLW1508",
    "PLW2901",
    "RET503",
    "RUF021",
    "RUF022",
    "RUF023",
    "SLF001",
    "TC001",
    "TC002",
    "TC003",
    "TC006",
    "TRY003",
    "TRY004",
    "TRY300",
    "TRY301",
    "TRY400",

    "ASYNC240",
    "B019",
    "C901",
    "E741",
    "PLC0415",
    "S101",
    "S606",
    "S607",
    "SIM105",
    "SIM115",
    "T201",
]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["ANN201", "B018", "INP001", "PLW0108", "PT018", "S101", "SIM105", "T20",
                # Fixtures stand in for credentials, which is what makes them fixtures.
                "S105", "S106",
                # Tests drive the real entry points as subprocesses.
                "S603"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "PEP 649 lazy annotations are the 3.14 default"

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "single"
inline-quotes = "single"
multiline-quotes = "single"

[tool.ruff.lint.isort]
lines-between-types = 1

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
